name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Tanaro.slnx

      - name: Build
        run: dotnet build Tanaro.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Tanaro.Nunit.Tests/Tanaro.Nunit.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack Tanaro/Tanaro.csproj -c Release --no-build -o artifacts/packages

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
