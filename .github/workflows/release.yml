name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Tanaro.slnx

      - name: Build
        run: dotnet build Tanaro.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Tanaro.Nunit.Tests/Tanaro.Nunit.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack Tanaro/Tanaro.csproj -c Release --no-build -o artifacts/packages
      
      # Get a short-lived NuGet API key
      - name: NuGet login
        uses: NuGet/login@v1.2.0
        id: nuget-login
        with:
          user: ${{secrets.NUGET_USER}} 

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ./artifacts/nuget/*.nupkg ./artifacts/nuget/*.snupkg \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"