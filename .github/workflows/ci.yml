name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Tanaro.slnx

      - name: Build
        run: dotnet build Tanaro.slnx -c Release --no-restore

      - name: Test (NUnit)
        run: dotnet test Tanaro.Nunit.Tests/Tanaro.Nunit.Tests.csproj -c Release --no-build

      - name: Test (xUnit)
        run: dotnet test Tanaro.XUnit.Tests/Tanaro.XUnit.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack Tanaro/Tanaro.csproj -c Release --no-build -o artifacts/packages

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
